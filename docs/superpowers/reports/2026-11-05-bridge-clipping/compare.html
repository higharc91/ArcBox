<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>OW-08 bridge clipping comparison</title>
<style>body{margin:24px;background:#111923;color:#e9e3d4;font:16px system-ui}main{max-width:1280px;margin:auto}h1{font-size:24px}button{padding:10px 16px;margin:4px;background:#293649;color:inherit;border:1px solid #8996a8;border-radius:4px}button[aria-pressed=true]{background:#66532f}figure{margin:20px 0}img{width:100%;height:auto;image-rendering:pixelated;border:1px solid #58677b}p{line-height:1.5}label{display:block;margin:14px 0}input{width:100%;max-width:400px}.stack{position:relative}.stack img{display:block}.stack .after{position:absolute;inset:0;clip-path:inset(0 0 0 50%)}figcaption{margin-top:8px;color:#c3ccda}</style>
<main><h1>Ashen Ford bridge · before / after</h1><p>The fixed renderer samples the complete texture frame. The bridge's world size, anchor and saved map remain unchanged.</p>
<nav aria-label="Viewpoint"><button data-view="west" aria-pressed="false">West lane</button><button data-view="deck" aria-pressed="true">Deck</button><button data-view="east" aria-pressed="false">East approach</button></nav>
<label>Comparison split — before on left, after on right <input id="split" type="range" min="0" max="100" value="50" aria-label="Before / after split"></label>
<figure><div class="stack"><img id="before" src="before-deck.png" alt="Before: bridge texture cropped at a straight edge"><img id="after" class="after" src="after-deck.png" alt="After: complete wooden span and stone endcaps"></div><figcaption>Same Godot world camera and standing tile. Ambient animation phases may differ.</figcaption></figure>
<p><a href="README.md" style="color:#e2c079">Verification report</a></p></main><script>const after=document.getElementById('after');document.getElementById('split').oninput=e=>after.style.clipPath='inset(0 0 0 '+e.target.value+'%)';for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{document.getElementById('before').src='before-'+b.dataset.view+'.png';after.src='after-'+b.dataset.view+'.png';for(const x of document.querySelectorAll('[data-view]'))x.setAttribute('aria-pressed',String(x===b));};</script></html>
