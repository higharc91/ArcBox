name: Check all

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/play/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Python test dependencies
        run: python -m pip install Pillow numpy

      - name: Build and run all test groups
        run: bash tools/check-all.sh --full
